<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* A single committed dark treatment - this is a war-room console for a game
     that is itself played on a dark screen. Every colour is painted explicitly
     so the page holds on whatever ground the host renders it over. */
  :root{
    --ground:#151823; --panel:#1c2030; --raised:#232839; --line:#2f3548;
    --ink:#e8e6df; --dim:#9aa1b4; --faint:#6b7286;
    --brass:#c8963e; --brass-dim:#8a6a2f;
    --good:#5fa971; --warn:#c9803f; --crit:#b8474d; --steel:#5b7fb0;
    --S:#c8963e; --A:#5fa971; --B:#5b7fb0; --C:#8c93a6; --D:#c9803f; --F:#b8474d;
    --display:"Oswald","Haettenschweiler","Arial Narrow",sans-serif;
    --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono","Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
       font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1560px;margin:0 auto;padding:26px 22px 64px;
        display:flex;flex-direction:column;gap:26px}
  .num,td.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;
         border-bottom:2px solid var(--brass-dim);padding-bottom:14px}
  h1{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.6px;
     text-transform:uppercase;margin:0;text-wrap:balance;line-height:1.1}
  h1 em{font-style:normal;color:var(--brass)}
  .sub{color:var(--dim);font-size:13px;margin-left:auto;text-align:right;
       font-family:var(--mono);font-size:12px}
  h2{font-family:var(--display);font-size:15px;text-transform:uppercase;
     letter-spacing:1.6px;color:var(--dim);margin:0 0 11px;font-weight:500}
  section{display:flex;flex-direction:column}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--brass);
        border-radius:3px;padding:13px 15px;display:flex;flex-direction:column;gap:2px}
  .card .k{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;
           font-family:var(--display);font-weight:500}
  .card .v{font-size:25px;font-weight:600;font-family:var(--mono);line-height:1.2}
  .card .n{font-size:11.5px;color:var(--faint)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .scroll{overflow-x:auto;max-height:76vh;overflow-y:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-family:var(--display);font-weight:500;color:var(--dim);font-size:10.5px;
     text-transform:uppercase;letter-spacing:1.1px;cursor:pointer;user-select:none;
     position:sticky;top:0;background:var(--raised);z-index:2}
  th:hover{color:var(--ink)}
  th.sorted{color:var(--brass)}
  th.sorted::after{content:" \25BC";font-size:8px}
  th.sorted.asc::after{content:" \25B2"}
  tbody tr{border-left:3px solid transparent}
  tbody tr:hover{background:var(--raised)}
  td.num{text-align:right}
  tr.sev-crit{border-left-color:var(--crit)}
  tr.sev-warn{border-left-color:var(--warn)}
  tr.sev-low{border-left-color:var(--brass-dim)}

  .tier{display:inline-block;min-width:21px;text-align:center;font-weight:600;
        font-family:var(--display);border-radius:2px;padding:1px 6px;font-size:12px;
        color:#151823}
  .tier.S{background:var(--S)} .tier.A{background:var(--A)} .tier.B{background:var(--B)}
  .tier.C{background:var(--C)} .tier.D{background:var(--D)} .tier.F{background:var(--F)}
  .bar{position:relative;background:var(--ground);border-radius:2px;height:17px;min-width:92px;
       border:1px solid var(--line)}
  .bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--brass-dim),var(--brass));
         border-radius:1px}
  .bar b{position:relative;font-size:11.5px;font-weight:600;padding-left:6px;line-height:15px;
         font-family:var(--mono)}
  .up{color:var(--good)} .down{color:var(--crit)} .flat{color:var(--faint)}
  .sub2{font-size:10.5px;color:var(--faint);font-family:var(--mono)}

  .flag{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.5px;
        font-family:var(--display);text-transform:uppercase;
        padding:1px 5px;border-radius:2px;margin-right:3px;border:1px solid}
  .flag.DEAD{color:var(--crit);border-color:#5a2c30;background:#2a1a1d}
  .flag.INACTIVE{color:var(--warn);border-color:#5a4229;background:#2a2119}
  .flag.LOW{color:var(--brass);border-color:#544224;background:#26211a}
  .flag.NO-SUPPORT,.flag.NO-BASELINE{color:var(--dim);border-color:#394054;background:#1e2230}

  .controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
  input[type=search],select{background:var(--raised);border:1px solid var(--line);
      color:var(--ink);border-radius:2px;padding:8px 11px;font-size:13px;font-family:var(--body)}
  input[type=search]{min-width:225px}
  input[type=search]:focus,select:focus,.chip:focus-visible{outline:2px solid var(--brass);
      outline-offset:1px}
  .chip{background:var(--raised);border:1px solid var(--line);color:var(--dim);
        border-radius:2px;padding:7px 14px;cursor:pointer;font-size:11.5px;
        font-family:var(--display);font-weight:500;letter-spacing:.9px;text-transform:uppercase}
  .chip.on{background:var(--brass);border-color:var(--brass);color:#151823}
  .count{color:var(--faint);font-size:12px;margin-left:auto;font-family:var(--mono)}

  tr.detail>td{background:var(--raised);white-space:normal;padding:15px 18px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:20px}
  .grid2 b,.panel>div>b{font-family:var(--display);font-size:11.5px;text-transform:uppercase;
        letter-spacing:1.1px;color:var(--brass);font-weight:500}
  .mrow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
  .mrow .lbl{width:122px;color:var(--dim);flex:none}
  .mrow .val{width:96px;text-align:right;color:var(--faint);flex:none;
             font-family:var(--mono);font-variant-numeric:tabular-nums}
  .mini{flex:1;background:var(--ground);height:8px;border-radius:2px;position:relative;
        min-width:56px;border:1px solid var(--line)}
  .mini i{position:absolute;inset:0 auto 0 0;background:var(--steel);border-radius:1px}
  .expander{cursor:pointer}
  .expander:hover .nm{color:var(--brass)}
  .note{color:var(--faint);font-size:12px;margin:9px 0 0}
  .banner{background:#241f17;border:1px solid var(--brass-dim);border-left:3px solid var(--brass);
          color:#e2cd9f;padding:11px 15px;border-radius:3px;font-size:13px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  /* Grid items default to min-width:auto, so a wide table would stretch its
     track and push the whole page sideways. Let them shrink and scroll. */
  .split>*,.grid2>*,.cards>*{min-width:0}
  @media(max-width:900px){.split{grid-template-columns:1fr}.mrow .lbl{width:98px}
    .sub{margin-left:0;text-align:left}}
  footer{padding-top:15px;border-top:1px solid var(--line);color:var(--faint);
         font-size:11.5px;font-family:var(--mono)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Kingdom Weekly <em>Rankings</em></h1>
    <div class="sub" id="subtitle"></div>
  </header>

  <div id="banner"></div>

  <section><h2>This Week</h2><div class="cards" id="cards"></div></section>

  <section><h2>Alliance Standings</h2>
    <div class="panel"><div class="scroll"><table id="allianceTable"></table></div></div>
  </section>

  <section>
    <h2>Member Rankings</h2>
    <div class="controls">
      <input type="search" id="search" placeholder="Search name or governor ID" aria-label="Search members">
      <span id="chips"></span>
      <select id="tierFilter" aria-label="Filter by tier">
        <option value="">All tiers</option>
        <option value="S">S tier</option><option value="A">A tier</option>
        <option value="B">B tier</option><option value="C">C tier</option>
        <option value="D">D tier</option><option value="F">F tier</option>
      </select>
      <select id="flagFilter" aria-label="Filter by status">
        <option value="">All members</option>
        <option value="DEAD">Kick candidates</option>
        <option value="INACTIVE">Inactive</option>
        <option value="LOW">Low activity</option>
        <option value="NO SUPPORT">No support given</option>
      </select>
      <span class="count" id="count"></span>
    </div>
    <div class="panel"><div class="scroll"><table id="memberTable"></table></div></div>
    <p class="note">Click any row for the full scorecard and week-by-week history.</p>
  </section>

  <div class="split">
    <section><h2>Action List</h2>
      <div class="panel"><div class="scroll" style="max-height:430px">
        <table id="actionTable"></table></div></div>
    </section>
    <section><h2 id="depTitle">Departures</h2>
      <div class="panel"><div class="scroll" style="max-height:430px">
        <table id="depTable"></table></div></div>
    </section>
  </div>

  <section><h2>How The Score Works</h2>
    <div class="panel" style="padding:17px 19px"><div id="method"></div></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
const DATA = /*__DATA__*/null;

const fmt = n => {
  n = Number(n) || 0;
  if (Math.abs(n) >= 1e9) return (n/1e9).toFixed(2)+"B";
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(2)+"M";
  if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(1)+"K";
  return String(Math.round(n));
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cls = s => String(s).replace(/[^A-Za-z0-9]+/g,"-");
const delta = v => v === null || v === undefined ? '<span class="flat">&ndash;</span>'
  : v > 0 ? '<span class="up">+'+ (typeof v==="number"&&v%1?v.toFixed(1):v) +'</span>'
  : v < 0 ? '<span class="down">'+ (typeof v==="number"&&v%1?v.toFixed(1):v) +'</span>'
  : '<span class="flat">0</span>';
const isDelta = k => DATA.metricModes && DATA.metricModes[k] === "delta";

document.getElementById("subtitle").innerHTML =
  esc(DATA.week) + " &middot; scan " + esc(DATA.scan) + "<br>" + DATA.members.length +
  " members &middot; " + DATA.alliances.length + " alliances" +
  (DATA.hasPrev ? " &middot; vs " + esc(DATA.prevLabel) : "");

if (!DATA.hasPrev) {
  document.getElementById("banner").innerHTML =
    '<div class="banner"><b>First tracked week.</b> Everyone is ranked on this week\'s ' +
    'activity as exported. Week-over-week gains, rank movement and departures switch on ' +
    'automatically once a second week folder is added.</div>';
}

/* ---------- summary tiles ---------- */
(() => {
  const ms = DATA.members;
  const avg = ms.reduce((a,m)=>a+m.s,0)/ms.length;
  const med = ms.map(m=>m.s).sort((a,b)=>a-b)[Math.floor(ms.length/2)];
  const inactive = ms.filter(m=>m.f.includes("INACTIVE")||m.f.includes("DEAD")).length;
  const dead = ms.filter(m=>m.f.includes("DEAD")).length;
  const top = ms[0], tc = DATA.tierCounts;
  const cards = [
    ["Members ranked", ms.length, DATA.alliances.map(a=>a.tag+" "+a.members).join("  ")],
    ["Average score", avg.toFixed(1), "median " + med.toFixed(1)],
    ["Top performer", esc(top.n), esc(top.a) + " &middot; " + top.s.toFixed(1) + " pts"],
    ["S / A tier", (tc.S||0)+" / "+(tc.A||0), "carrying the kingdom"],
    ["Needs action", inactive, dead + " over 14 days idle"],
  ];
  document.getElementById("cards").innerHTML = cards.map(c =>
    `<div class="card"><span class="k">${c[0]}</span><span class="v">${c[1]}</span>
     <span class="n">${c[2]}</span></div>`).join("");
})();

/* ---------- alliance standings ---------- */
(() => {
  const rows = DATA.alliances.map(a => `<tr>
    <td class="num">${a.rank}</td>
    <td><b>${esc(a.tag)}</b></td>
    <td>${esc(a.name)}</td>
    <td class="num">${a.members}</td>
    <td class="num"><b>${a.avg_score.toFixed(1)}</b></td>
    <td class="num">${a.median_score.toFixed(1)}</td>
    <td class="num">${a.avg_change===null?'<span class="flat">&ndash;</span>':delta(a.avg_change)}</td>
    <td class="num">${a.top_tier}</td>
    <td class="num">${a.inactive}</td>
    <td class="num">${fmt(a.total_power)}</td>
    ${DATA.metrics.map(k=>`<td class="num">${fmt(a.totals[k])}</td>`).join("")}
  </tr>`).join("");
  document.getElementById("allianceTable").innerHTML =
    `<thead><tr><th>#</th><th>Tag</th><th>Alliance</th><th class="num">Members</th>
     <th class="num">Avg</th><th class="num">Median</th><th class="num">vs last</th>
     <th class="num">S+A</th><th class="num">Idle</th><th class="num">Power</th>
     ${DATA.metrics.map(k=>`<th class="num">${esc(DATA.metricLabels[k])}${isDelta(k)?" &Delta;":""}</th>`).join("")}
     </tr></thead><tbody>${rows}</tbody>`;
})();

/* ---------- member table ---------- */
const COLS = [
  {k:"r",  t:"#",        n:1, f:m=>m.r},
  {k:"n",  t:"Governor", n:0, f:m=>`<span class="nm">${esc(m.n)}</span>` +
      (m.ti?`<br><span class="sub2">${esc(m.ti)}</span>`:"")},
  {k:"a",  t:"Ally",     n:0, f:m=>esc(m.a)},
  {k:"gr", t:"Rk",       n:0, f:m=>esc(m.gr)},
  {k:"s",  t:"Score",    n:1, f:m=>`<div class="bar"><i style="width:${m.s}%"></i>
      <b>${m.s.toFixed(1)}</b></div>`},
  {k:"t",  t:"Tier",     n:0, f:m=>`<span class="tier ${m.t}">${m.t}</span>`},
  {k:"sc", t:"+/-",      n:1, f:m=>delta(m.sc)},
  {k:"rc", t:"Move",     n:1, f:m=>delta(m.rc)},
  {k:"ra", t:"In ally",  n:1, f:m=>m.ra},
  {k:"p",  t:"Power",    n:1, f:m=>fmt(m.p)},
  {k:"ch", t:"CH",       n:1, f:m=>m.ch||""},
  {k:"di", t:"Idle d",   n:1, f:m=>m.di},
  {k:"f",  t:"Status",   n:0, f:m=>m.f.map(x=>
      `<span class="flag ${cls(x)}">${esc(x)}</span>`).join("")},
];
/* A delta column leads with the week's gain and keeps the running total
   underneath, so the two can never be read as the same number. */
const METRIC_COLS = DATA.metrics.map(k => ({
  k:"mv."+k, t:DATA.metricLabels[k] + (isDelta(k) ? " Δ" : ""), n:1,
  f:m => isDelta(k)
    ? `${fmt(m.mv[k])}<br><span class="sub2">of ${fmt(m.mt[k])}</span>`
    : fmt(m.mv[k])
}));
const ALL_COLS = COLS.concat(METRIC_COLS);

let sortKey = "r", sortAsc = true, allianceFilter = "";

document.getElementById("chips").innerHTML =
  ['<span class="chip on" tabindex="0" data-a="">All</span>']
  .concat(DATA.alliances.map(a=>
    `<span class="chip" tabindex="0" data-a="${esc(a.tag)}">${esc(a.tag)}</span>`)).join(" ");
document.querySelectorAll(".chip").forEach(c => {
  const pick = () => {
    document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
    c.classList.add("on"); allianceFilter = c.dataset.a; render();
  };
  c.onclick = pick;
  c.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };
});

const get = (m,k) => k.startsWith("mv.") ? m.mv[k.slice(3)] : m[k];
const sev = m => m.f.includes("DEAD") ? "sev-crit"
  : m.f.includes("INACTIVE") ? "sev-warn" : m.f.includes("LOW") ? "sev-low" : "";

function visible() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const tier = document.getElementById("tierFilter").value;
  const flag = document.getElementById("flagFilter").value;
  return DATA.members.filter(m =>
    (!allianceFilter || m.a === allianceFilter) &&
    (!tier || m.t === tier) &&
    (!flag || m.f.includes(flag)) &&
    (!q || m.n.toLowerCase().includes(q) || String(m.id).includes(q)));
}

function detailRow(m) {
  const cats = Object.entries(m.c).map(([k,v]) =>
    `<div class="mrow"><span class="lbl">${esc(k)}</span>
      <span class="mini"><i style="width:${v}%"></i></span>
      <span class="val">${v.toFixed(1)}</span></div>`).join("");
  const mets = DATA.metrics.map(k =>
    `<div class="mrow"><span class="lbl">${esc(DATA.metricLabels[k])}${isDelta(k)?" Δ":""}</span>
      <span class="mini"><i style="width:${m.ms[k]}%"></i></span>
      <span class="val">${fmt(m.mv[k])}${isDelta(k)?
        ` <span class="flat">/${fmt(m.mt[k])}</span>`:""}</span></div>`).join("");
  const hist = m.h.length > 1 ? m.h.map(w =>
    `<div class="mrow"><span class="lbl">${esc(w.label)}</span>
      <span class="mini"><i style="width:${w.score}%"></i></span>
      <span class="val">${w.score.toFixed(1)} <span class="tier ${w.tier}"
      style="min-width:15px">${w.tier}</span></span></div>`).join("")
    : '<div class="note">Only one week of data so far.</div>';
  return `<tr class="detail"><td colspan="${ALL_COLS.length}"><div class="grid2">
    <div><b>Category scores</b>${cats}</div>
    <div><b>Metric detail</b>${mets}</div>
    <div><b>Week history</b>${hist}
      <div class="note" style="margin-top:11px">
        Governor ID ${m.id} &middot; power ${fmt(m.p)}
        ${m.pg?` (+${fmt(m.pg)} this week)`:""} &middot; CH ${m.ch||"?"}<br>
        ${m.da} days in alliance &middot; idle ${m.di} d &middot;
        overall #${m.r}, #${m.ra} in ${esc(m.a)}</div></div>
  </div></td></tr>`;
}

function render() {
  const rows = visible().sort((a,b) => {
    const x = get(a,sortKey), y = get(b,sortKey);
    const c = (typeof x === "string" || typeof y === "string")
      ? String(x??"").localeCompare(String(y??""))
      : (Number(x??0) - Number(y??0));
    return sortAsc ? c : -c;
  });
  document.getElementById("memberTable").innerHTML =
    `<thead><tr>${ALL_COLS.map(c =>
      `<th data-k="${c.k}" class="${c.n?"num":""} ${c.k===sortKey?"sorted "+(sortAsc?"asc":""):""}"
        >${esc(c.t)}</th>`).join("")}</tr></thead>
     <tbody>${rows.map(m =>
      `<tr class="expander ${sev(m)}" data-id="${m.id}">${ALL_COLS.map(c =>
        `<td class="${c.n?"num":""}">${c.f(m)}</td>`).join("")}</tr>`).join("")}</tbody>`;
  document.getElementById("count").textContent = rows.length + " shown";

  document.querySelectorAll("#memberTable th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (k === sortKey) sortAsc = !sortAsc;
    else { sortKey = k; sortAsc = (k === "r" || k === "n" || k === "a"); }
    render();
  });
  document.querySelectorAll("#memberTable tr.expander").forEach(tr => tr.onclick = () => {
    const nxt = tr.nextElementSibling;
    if (nxt && nxt.classList.contains("detail")) { nxt.remove(); return; }
    document.querySelectorAll("tr.detail").forEach(d => d.remove());
    tr.insertAdjacentHTML("afterend",
      detailRow(DATA.members.find(x => String(x.id) === tr.dataset.id)));
  });
}
["search","tierFilter","flagFilter"].forEach(id =>
  document.getElementById(id).addEventListener("input", render));
render();

/* ---------- action list ---------- */
(() => {
  const priority = {DEAD:0, INACTIVE:1, "NO SUPPORT":2, LOW:3};
  const rows = DATA.members
    .filter(m => m.f.some(f => f in priority))
    .sort((a,b) => Math.min(...a.f.map(f=>priority[f]??9)) -
                   Math.min(...b.f.map(f=>priority[f]??9)) || a.s - b.s)
    .map(m => `<tr class="${sev(m)}"><td>${esc(m.a)}</td><td>${esc(m.n)}</td>
      <td class="num">${m.s.toFixed(1)}</td>
      <td><span class="tier ${m.t}">${m.t}</span></td>
      <td class="num">${m.di}</td><td class="num">${fmt(m.p)}</td>
      <td>${m.f.map(x=>`<span class="flag ${cls(x)}">${esc(x)}</span>`).join("")}</td></tr>`).join("");
  document.getElementById("actionTable").innerHTML =
    `<thead><tr><th>Ally</th><th>Governor</th><th class="num">Score</th><th>Tier</th>
     <th class="num">Idle</th><th class="num">Power</th><th>Why</th></tr></thead>
     <tbody>${rows || '<tr><td colspan="7">Nothing flagged &ndash; clean week.</td></tr>'}</tbody>`;
})();

/* ---------- departures ---------- */
(() => {
  const rows = DATA.departures.map(d => `<tr><td>${esc(d.alliance_tag)}</td>
    <td>${esc(d.name)}</td><td class="num">${fmt(d.power)}</td>
    <td class="num">${d.last_score===null?"&ndash;":Number(d.last_score).toFixed(1)}</td>
    <td>${d.last_tier?`<span class="tier ${d.last_tier}">${d.last_tier}</span>`:""}</td></tr>`).join("");
  document.getElementById("depTitle").textContent =
    "Departures (" + DATA.departures.length + ")";
  document.getElementById("depTable").innerHTML =
    `<thead><tr><th>Was in</th><th>Governor</th><th class="num">Power</th>
     <th class="num">Last score</th><th>Tier</th></tr></thead>
     <tbody>${rows || '<tr><td colspan="5">' +
       (DATA.hasPrev ? "Nobody left since last week." :
        "Tracked from the second week onward.") + '</td></tr>'}</tbody>`;
})();

/* ---------- methodology ---------- */
(() => {
  const total = Object.values(DATA.weights).reduce((a,b)=>a+b,0) || 1;
  const rows = DATA.metrics.map(k =>
    `<div class="mrow"><span class="lbl">${esc(DATA.metricLabels[k])}${isDelta(k)?" Δ":""}</span>
     <span class="mini"><i style="width:${DATA.weights[k]/total*100}%"></i></span>
     <span class="val">${(DATA.weights[k]/total*100).toFixed(0)}%</span></div>`).join("");
  document.getElementById("method").innerHTML = `<div class="grid2">
    <div><b>Weighting</b>${rows}</div>
    <div><b>Method</b><div class="note" style="font-size:13px;color:var(--dim);margin-top:5px">
      ${DATA.usesDelta ? `Stats marked <b>&Delta;</b> score the <b>increase since last week</b>,
        not the running total &ndash; a member who added 20M kill points outranks one sitting
        on a 100M total who added 10M. ` : ""}
      Each stat becomes a 0&ndash;100 score on the <b>${esc(DATA.curve)}</b> curve, measured against
      ${DATA.pool === "global" ? "everyone in the kingdom" : "the member's own alliance"},
      combined using the weights at left, then multiplied by an inactivity factor.
      How long someone has been in the alliance is not part of the score.
      <br><br>Edit <b>config.toml</b> to change any weight, penalty or cut-off, then re-run.
    </div></div></div>`;
})();

document.getElementById("footer").textContent =
  "Generated " + DATA.generated + " · source: " + DATA.week +
  " · weeks tracked: " + DATA.weekList.join(", ");
</script>
